<form [formGroup]="userProfileForm" (ngSubmit)="authorization()">
    <h3 class="title">Авторизация</h3>
    <input class="input" formControlName="login" placeholder="Логин">
    <input class="input" formControlName="password" placeholder="Пароль">
    <button class = "button" type="submit">Войти</button>
</form>
