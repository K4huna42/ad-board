<div class="card" (click)="onCardClick()">
    <div class="card_img">
        <app-images [img_ids]="data.imagesIds"></app-images>
    </div>
    <div class="card_text">
        <p class="card_text-title">{{ data.name }}</p>
        <p class="card_text-price">{{ data.cost }}$</p>
        <p class="card_text-meta">{{ data.location }}</p>
        <p class="card_text-meta">{{ data.createdAt | russianDate }}</p>
    </div>
    @if(showActions) {
    <div class="card__actions">
        <button (click)="goToEdit()" class="edit-btn" title="Редактировать">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" stroke="currentColor" stroke-width="2"
                    stroke-linejoin="round" />
                <path d="M14.06 4.94l3.75 3.75L21 5.5l-3.75-3.75-3.19 3.19z" stroke="currentColor" stroke-width="2"
                    stroke-linejoin="round" />
            </svg>
        </button>

        <button class="delete-btn" (click)="$event.stopPropagation()" title="Удалить" (click)="confirmDelete()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </button>
    </div>
    }
</div>
