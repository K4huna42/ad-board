<div class="container">
  @if (showBreadcrumbs() && mergedBreadcrumbs.length > 0) {
    <div class="breadcrumbs">
      @for (breadcrumb of mergedBreadcrumbs; track $index) {
        <a [routerLink]="breadcrumb.url">{{ breadcrumb.title }}</a>
        @if (!$last) { > }
      }
    </div>
  }
</div>
